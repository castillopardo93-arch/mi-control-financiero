/* Alertas de vencimiento */
.alert-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 20px}

.alert-metric small{color:var(--muted)}
.alert-list{display:grid;gap:10px}
.alert-row{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.alert-row:last-child{border-bottom:0}
.alert-row p{margin:3px 0 0;color:var(--muted);font-size:13px}
.alert-bullet{width:9px;height:9px;border-radius:50%;background:var(--gold);flex:none}
.alert-bullet.late{background:var(--red)}
.alert-settings{display:grid;gap:12px}

/* v144: control discreto para volver a contraer la tarjeta expandida. */
.debt-card-head{position:relative;padding-right:44px}
.debt-collapse-control{position:absolute;right:0;top:0;display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;padding:0 8px;border:1px solid #d9e5df;border-radius:9px;background:var(--card);color:var(--green);font-size:18px;line-height:1;cursor:pointer}
.debt-collapse-control:hover{background:#e8f4ed}
.debt-collapse-control:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* v143: vista inicial compacta de créditos; la tarjeta original se conserva intacta al expandir. */
.debt-card-v22{position:relative}
.debt-compact-head{display:flex;align-items:center;gap:13px;width:100%;box-sizing:border-box;padding:14px 16px;border:1px solid #d9e5df;border-radius:14px;background:var(--card);color:var(--ink);text-align:left;cursor:pointer}
.debt-compact-head[hidden]{display:none!important}
.debt-compact-icon{width:42px;height:42px;display:flex;align-items:center;justify-content:center;flex:none;border-radius:50%;background:#e8f4ed;color:var(--green);font-size:20px}
.debt-compact-copy{min-width:0;flex:1}
.debt-compact-title{display:block;font-weight:850;font-size:16px;line-height:1.25;color:var(--green);overflow-wrap:anywhere}
.debt-compact-subtitle{display:block;margin-top:4px;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.debt-compact-balance{display:grid;gap:2px;min-width:0;text-align:right;color:var(--muted);font-size:11px;line-height:1.3;font-variant-numeric:tabular-nums}
.debt-compact-balance strong{color:var(--ink);font-weight:650}
.debt-compact-uf{min-width:0;text-align:right}
.debt-compact-uf strong{display:block;font-size:clamp(14px,1.5vw,19px);font-weight:850;color:var(--ink);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.debt-compact-uf span{display:block;margin-top:3px;color:var(--muted);font-size:11px}
.debt-compact-chevron{flex:none;font-size:21px;color:var(--green);padding:0 2px}
.debt-card-v22.debt-card-collapsed{padding:0;border:0;background:transparent;box-shadow:none;overflow:visible}
.debt-card-v22.debt-card-collapsed&gt;.debt-compact-head{display:flex}
.debt-card-v22.debt-card-collapsed&gt;:not(.debt-compact-head){display:none!important}
.debt-card-v22:not(.debt-card-collapsed)&gt;.debt-compact-head{display:none!important}

/* v197: colapsado opcional, manteniendo diseño v192 */
.mcf-programmed-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto}
.mcf-programmed-tile-actions{margin-top:7px;display:flex;align-items:center}
.mcf-programmed-tile-actions .btn{font-size:12px;padding:5px 12px}
.checklist-recurrence-panel.mcf-collapsed .checklist-recurrence-head{margin-bottom:0}
#mcfProgrammedCards[hidden]{display:none!important}
@media(max-width:700px){.checklist-recurrence-panel{padding:13px}.checklist-recurring-grid{grid-template-columns:1fr}}
&lt;/style&gt;&lt;style id=&quot;v198-cloud-only&quot;&gt;
#cloudGate{position:fixed;inset:0;z-index:99999;background:rgba(18,37,32,.94);display:flex;align-items:center;justify-content:center;padding:18px}
#cloudGate[hidden]{display:none!important}
#cloudGatePanel{max-width:540px;width:100%;padding:28px;border-radius:17px;background:#fff;color:#18382d;box-shadow:0 12px 45px #0004}
#cloudGatePanel h2{margin:0 0 12px;font-size:21px}
#cloudGatePanel p{line-height:1.5;font-size:14px}
#cloudGatePanel .btn{margin:4px 6px 4px 0}
#cloudGateMessage{font-weight:600;overflow-wrap:anywhere}
#cloudSyncBar{position:fixed;right:15px;bottom:15px;z-index:1200;padding:12px 15px;border-radius:12px;background:#173c32;color:white;box-shadow:0 5px 22px #0003;max-width:min(92vw,430px);font-size:12px;display:flex;align-items:center;flex-wrap:wrap;gap:10px}
#cloudSyncBar button{border:1px solid #aec8bb;border-radius:8px;padding:6px 9px;background:white;color:#173c32;cursor:pointer}
#cloudSyncBar[data-state=&quot;error&quot;]{background:#82382f}
#cloudSyncBar[data-state=&quot;pending&quot;]{background:#765a1f}
&lt;/style&gt;&lt;style id=&quot;mcf-v203-recovery-style&quot;&gt;
#mcfRecoverLaunch{position:fixed;left:15px;bottom:15px;z-index:1300}
#mcfRecoverLaunch[hidden],#mcfRecoverOverlay[hidden]{display:none!important}
#mcfRecoverLaunch button{border:0;background:#f0c46f;color:#143d32;box-shadow:0 4px 20px #0004;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
#mcfRecoverOverlay{position:fixed;inset:0;z-index:99998;background:#071b17e8;display:flex;justify-content:center;align-items:center;padding:18px}
#mcfRecoverPanel{width:min(96vw,720px);max-height:90vh;overflow-y:auto;background:white;color:#193b31;border-radius:16px;padding:24px;box-shadow:0 12px 40px #0005}
#mcfRecoverPanel h2{margin:0 0 6px;font-size:21px}
#mcfRecoverPanel p,#mcfRecoverPanel label{font-size:14px;line-height:1.5}
#mcfRecoverPanel select,#mcfRecoverPanel input[type=file]{width:100%;padding:10px;margin:8px 0 12px;max-width:100%;border:1px solid #b0bfb6;border-radius:7px;background:#fff;color:#123}
#mcfRecoverStats{padding:12px;background:#f1f6f3;color:#183c30;border-radius:8px;min-height:90px;white-space:pre-wrap;line-height:1.5;font-size:13px;overflow-wrap:anywhere}
#mcfRecoverActions{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px}
#mcfRecoverActions button{padding:11px 14px;border:1px solid #657b70;background:#fff;border-radius:8px;cursor:pointer}
#mcfRecoverActions button.primary{background:#204c3c;color:#fff;border-color:#204c3c}
#mcfRecoverActions button:disabled{opacity:.5;cursor:not-allowed}
@media(max-width:700px){
 #cloudGate{align-items:safe center;overflow:auto;padding:12px}
 #cloudGatePanel{box-sizing:border-box;max-height:calc(100dvh - 24px);overflow:auto;padding:16px}
 #cloudGatePanel select,#cloudGatePanel button,#localStorageCard button{box-sizing:border-box;max-width:100%;white-space:normal;min-height:44px}
 #cloudGatePanel button{margin:4px 0;width:100%}
 #localStorageCard .inline-actions{display:grid;grid-template-columns:minmax(0,1fr)}
 #localStorageCard,#storageDestination,#storageHelp,#cloudSyncText{min-width:0;overflow-wrap:anywhere}
 #cloudSyncBar{position:static;margin:6px 10px;flex-wrap:wrap;max-width:100%;box-sizing:border-box}
 .recovery-drive-header{flex-wrap:wrap}
}
@media (max-width:700px){
 .debt-card-v22.debt-card-collapsed&gt;.debt-compact-head{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;
  grid-template-areas:&quot;icon name arrow&quot; &quot;summary summary summary&quot;;
  column-gap:9px;row-gap:6px;
 }
 .debt-compact-icon{grid-area:icon}
 .debt-compact-copy{grid-area:name}
 .debt-compact-chevron{grid-area:arrow}
 .debt-compact-uf,.debt-compact-balance{grid-area:summary;min-width:0;text-align:right}
}
